[package]
name = "near-vault"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ARPK NEAR vault: bounded value movement enforced by receipts."

[lib]
crate-type = ["cdylib", "rlib"]

# The `sandbox` tier is CI-only: the near-sandbox binary is glibc-only, so it cannot run
# on Termux/Bionic. The dependency is optional so `cargo test` locally never builds it.
[features]
sandbox = ["dep:near-workspaces"]

[dependencies]
near-sdk = { version = "5.30.1", features = ["unstable", "unit-testing"] }
arpk-core = { path = "../../crates/arpk-core" }
near-workspaces = { version = "0.22", optional = true }

[dev-dependencies]
k256 = { version = "0.14", features = ["ecdsa"] }
sha3 = "0.10"
proptest = "1.12"
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# The e2e submits the receipt the kernel actually produces, so it links the kernel library.
arpkd = { path = "../../kernel" }
