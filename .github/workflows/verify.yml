name: verify

on:
  push:
  pull_request:

jobs:
  # Local tier: pure Rust + wasm. Mirrors `make verify`.
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: arpk-core model tests
        run: cargo test -p arpk-core
      - name: arpkd kernel tests
        run: cargo test -p arpkd
      - name: vault native tests
        run: cargo test --manifest-path contracts/near-vault/Cargo.toml

  # The contract must compile to wasm with the pinned toolchain.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo build --manifest-path contracts/near-vault/Cargo.toml --target wasm32-unknown-unknown --release
      - uses: actions/upload-artifact@v4
        with:
          name: vault-wasm
          path: contracts/near-vault/target/wasm32-unknown-unknown/release/near_vault.wasm

  # CI tier: the P0 end-to-end. The near-sandbox binary is glibc-only, so this runs on
  # Ubuntu and cannot run on Termux/Bionic. It builds the wasm, deploys it to a sandbox,
  # has the kernel library sign a receipt, and submits it with a function-call key.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - run: rustup target add wasm32-unknown-unknown
      - name: build the vault wasm
        run: cargo build --manifest-path contracts/near-vault/Cargo.toml --target wasm32-unknown-unknown --release
      - name: sandbox e2e (intent -> receipt -> on-chain transfer)
        run: cargo test --manifest-path contracts/near-vault/Cargo.toml --features sandbox --test e2e -- --nocapture

  # CI tier: volume evidence for C0. Release mode, real Linux runner. The model fuzz is
  # pure arithmetic; the differential drives the real contract through 10^4 operations.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: model fuzz at volume (10^5 cases per property)
        run: PROPTEST_CASES=100000 cargo test --release -p arpk-core --test fuzz -- --nocapture
      - name: native differential at volume (10^4 steps)
        run: DIFFERENTIAL_STEPS=10000 cargo test --release --manifest-path contracts/near-vault/Cargo.toml --test differential -- --nocapture

  # CI tier: Kani on the `arpk-core` cap arithmetic (claim C10). Kani does not support
  # Termux, so this is CI-only. The harnesses live in crates/arpk-core/kani/ and are
  # compiled only under `--cfg kani`, so they cost nothing in a normal build.
  #
  # One job per harness, in parallel: 128-bit arithmetic is bit-blasted, and a single
  # `cargo kani` run hides which harness is the expensive one. `fail-fast: false` so a
  # hard harness does not mask the others, and `timeout-minutes` so it fails rather than
  # hanging for the GitHub default.
  kani:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        harness:
          - bucket_step_lemma
          - tokens_never_exceed_capacity
          - failed_take_leaves_state_unchanged
          - time_regression_is_rejected_without_mutation
          - pct_cap_matches_its_definition
          - per_call_and_venue_exposure_checks
    steps:
      - uses: actions/checkout@v4
      - uses: model-checking/kani-github-action@v1.1
        with:
          working-directory: crates/arpk-core
          args: --harness ${{ matrix.harness }}

  # CI tier: Docker containment. Enabled in WP2.
  # containment:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: docker compose -f deploy/docker-compose.yml up -d
  #     - run: docker compose -f deploy/docker-compose.yml exec -T agent /usr/local/bin/capability-inventory.sh
